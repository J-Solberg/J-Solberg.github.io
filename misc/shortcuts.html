            /* PORTFOLIO PAGE */

            body { 
                font-family: Avenir, Futura, "Open Sans", sans-serif;
                color: gray;
            }

            main.portfolio {
                display: grid;
                gap: 1rem;
                grid-template-columns: repeat(auto-fit, 15rem); /* Says: "create as many 15rem columns as will fit on a row in the available space. Wrap onto new rows until you run out of items. The number of rows and columns may change depending on the width of the browser. */

                /* sets the number and size of columns in a CSS grid container */

                justify-content: center; 
                background-color: #e3e3e3; /* gray bg can be removed */
                padding: 3rem;
            }

            main.portfolio p {
                font-family: Arial, Helvetica, sans-serif;
                border: 0px solid lightgray; /* border has been removed by setting to 0 */
                padding: 1rem;
                background-color: #FFF;
                text-align: center;
            }

            div.portfolio {
                border: white 2px solid; /* border can be removed by setting to 0 */
                background-color:  #fdfaee;
                display: flex; /* makes this div into a flex container */ 
                flex-direction: column; /* When the div.portfolio box grows, any extra space is distributed below the p text. */
            }

            img {
                border: white solid 0px; /* border has been removed */
                max-width: 100%;      
            }

            a:link {
                color: black;
                text-decoration: none;
            }

            a:visited {
                color: black;
                text-decoration: none;
            }

            a:hover {
                color: gray;
                text-decoration: underline;
            }

        
    </style>
