<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid demo</title>

    <style>
        body {
            margin: 0;
            display: grid;
            grid-template-columns: 100px 1fr;
        }
        main {
            border: black 2px solid;
            display: grid;
            grid-template-columns: 75px 1fr 1fr;
        }

        p {
            background-color: palegoldenrod;
            margin: .5rem;
        }

        header {
            background-color: bisque;
            padding: .5rem;
        }

        .special {
            background-color: lightblue;
            grid-column: 2 / 4;
            grid-row: 1 / 3;
        }

    </style>
</head>

<body>
    <header><h1>This is my fruit stand</h1></header>
    <main>
        <p>apples</p>
        <p>oranges</p>
        <p>peaches</p>
        <p>pears</p>
        <p>pineapple</p>
        <p>bananas</p>
        <p class="special">kiwi</p>
    </main>

    
</body>
</html>
